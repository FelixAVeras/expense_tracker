<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Gastos</title>
    <!-- Bulma y FontAwesome -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- Archivo de estilos -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container max-width-container py-5 px-4">
        
        <!-- Encabezado -->
        <header class="is-flex is-align-items-center is-justify-content-space-between mb-5 pb-4 border-bottom">
            <div>
                <h1 class="title is-4 mb-1">Control de Gastos</h1>
                <p class="subtitle is-7">Registro personal</p>
            </div>
            <div class="is-flex" style="gap: 0.5rem;">
                <button class="button is-small is-white border-light" id="btn-exportar">
                    <i class="fa-solid fa-download mr-2"></i> Exportar
                </button>
                <button class="button is-small is-white border-light" id="btn-importar-ui">
                    <i class="fa-solid fa-upload mr-2"></i> Importar
                </button>
                <input type="file" id="input-importar" accept=".json" style="display: none;">
            </div>
        </header>

        <!-- Tarjeta de Resumen (Gasto Acumulado Total) -->
        <div class="box summary-box mb-5 has-text-centered">
            <p class="heading mb-2">Gasto Total Acumulado</p>
            <p class="title summary-total" id="total-gastos-display">$0.00</p>
        </div>

        <div class="columns is-variable is-6">
            <!-- Columna Izquierda: Formulario + Historial Mensual -->
            <div class="column is-4-desktop">
                
                <!-- Formulario -->
                <div class="box mb-5">
                    <h2 class="title is-6 mb-4" id="form-title">Nuevo Registro</h2>
                    <form id="gasto-form">
                        <input type="hidden" id="gasto-id" value="">

                        <div class="field mb-3">
                            <label class="label is-small">Fecha</label>
                            <div class="control">
                                <input class="input minimal-input" type="date" id="fecha" required>
                            </div>
                        </div>

                        <div class="field mb-3">
                            <label class="label is-small">Descripción</label>
                            <div class="control">
                                <input class="input minimal-input" type="text" id="descripcion" placeholder="Ej. Supermercado, Gasolina..." required>
                            </div>
                        </div>
                        
                        <div class="field mb-4">
                            <label class="label is-small">Monto ($)</label>
                            <div class="control">
                                <input class="input minimal-input" type="number" id="monto" placeholder="0.00" step="0.01" min="0" required>
                            </div>
                        </div>
                        
                        <div class="field mt-4">
                            <div class="control">
                                <button class="button is-dark is-fullwidth" type="submit" id="btn-submit">
                                    Guardar Gasto
                                </button>
                            </div>
                        </div>
                        <div class="field is-hidden mt-2" id="btn-cancelar-container">
                            <div class="control">
                                <button class="button is-fullwidth" type="button" id="btn-cancelar">
                                    Cancelar
                                </button>
                            </div>
                        </div>
                    </form>
                </div>

                <!-- Tabla Pequeña: Resumen por Meses -->
                <div class="box">
                    <h3 class="title is-6 mb-3">
                        <i class="fa-solid fa-calendar-check mr-2 color-primary"></i>Totales por Mes
                    </h3>
                    <div class="table-container">
                        <table class="table is-fullwidth minimal-table is-narrow">
                            <thead>
                                <tr>
                                    <th>Mes</th>
                                    <th class="has-text-right">Total</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-meses-body">
                                <!-- Inyectado con JS -->
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>

            <!-- Columna Derecha: Movimientos Agrupados por Día -->
            <div class="column">
                <div class="box">
                    <h2 class="title is-6 mb-4">Historial por Días</h2>
                    <div class="table-container">
                        <table class="table is-fullwidth minimal-table">
                            <thead>
                                <tr>
                                    <th style="width: 20%;">Fecha</th>
                                    <th style="width: 45%;">Descripción</th>
                                    <th class="has-text-right" style="width: 20%;">Monto</th>
                                    <th class="has-text-centered" style="width: 15%;">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="lista-gastos">
                                <!-- Inyectado con JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
